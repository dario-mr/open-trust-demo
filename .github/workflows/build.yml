# Vendor pipeline: build the image (clean, and deliberately vulnerable), then hand each to the
# Open Trust assessor in another repository. This repository can only call it, pinned by commit;
# it cannot add steps to it, so the signature can prove the assessment ran unmodified.
name: build and assess

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push the image to ghcr.io
      id-token: write      # sign the build provenance
      attestations: write  # store it in GitHub's attestation API
    outputs:
      # one key per variant: the matrix legs each set their own
      ref-clean: ${{ steps.digest.outputs.ref-clean }}
      ref-vulnerable: ${{ steps.digest.outputs.ref-vulnerable }}
    strategy:
      matrix:
        variant: [clean, vulnerable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
      - name: Build, push to ghcr.io, and keep an OCI tar (one build, two outputs)
        run: |
          docker buildx build --provenance=mode=min --sbom=false \
            --build-arg VARIANT=${{ matrix.variant }} \
            --output type=oci,dest=image.oci.tar \
            --output type=image,name=ghcr.io/${{ github.repository }}:${{ matrix.variant }},push=true \
            --metadata-file meta.json .
      - name: Image manifest digest
        id: digest
        # with BuildKit attestations, index.json points at a nested index; the subject is the image manifest
        run: |
          idx=$(tar -xOf image.oci.tar index.json | jq -r '.manifests[0].digest')
          d=$(tar -xOf image.oci.tar "blobs/sha256/${idx#sha256:}" | jq -r '[.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")] | if length == 1 then .[0].digest else error("expected one image manifest") end')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          # the registry's index differs from the tar's (exporter annotations), but the image manifest,
          # which the certificate binds, must be the same: then the tar and the registry image are one subject
          pushed=$(jq -r '."containerimage.digest"' meta.json)
          rd=$(docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}@$pushed" | jq -r '[.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")] | .[0].digest')
          [ "$rd" = "$d" ] || { echo "::error::registry image manifest $rd, tar has $d"; exit 1; }
          echo "ref-${{ matrix.variant }}=ghcr.io/${{ github.repository }}@$pushed" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: example.com/open-trust-demo
          subject-digest: ${{ steps.digest.outputs.digest }}
          create-storage-record: false
      - run: cp "${{ steps.attest.outputs.bundle-path }}" provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.variant }}
          path: |
            image.oci.tar
            provenance.sigstore.json
          if-no-files-found: error

  assess:
    needs: build
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [clean, vulnerable]
    uses: dario-mr/open-trust/.github/workflows/assess.yml@78c55a0a2b31ae0fc480f675757681ad0b473d36 # v0.1.11
    with:
      image-ref: ${{ needs.build.outputs[format('ref-{0}', matrix.variant)] }}
      # the artifact still carries the signed provenance bundle (and the tar, for offline buyers)
      image-artifact: image-${{ matrix.variant }}
      subject-name: example.com/open-trust-demo:${{ matrix.variant }}
      # the vulnerable image is expected to fail; keep the run green and the certificate as the record
      fail-on-failed-assessment: ${{ matrix.variant == 'clean' }}
