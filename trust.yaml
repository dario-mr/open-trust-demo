# Customer-side trust policy: accept only certificates signed by the Open Trust assessor workflow
# at a pinned revision, assessing this repository's main branch on a GitHub-hosted runner.
minTrustLevel: L1+isolated-assessor
signers:
  - name: Open Trust assessor (348609a5a85569de4b8882dc6c63fad1fbf46a23) for open-trust-demo
    issuer: https://token.actions.githubusercontent.com
    sourceRepo: https://github.com/dario-mr/open-trust-demo
    sourceRef: refs/heads/main
    buildSigner: ^https://github\.com/dario-mr/open-trust/\.github/workflows/assess\.yml@348609a5a85569de4b8882dc6c63fad1fbf46a23$
    requireHostedRunner: true
