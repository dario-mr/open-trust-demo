# Vendor pipeline on GitLab: the same app as the GitHub workflow, assessed by the Open Trust
# template pinned to a commit. Trust level L1+ci-identity: GitLab's OIDC identity names this
# pipeline, not the included template, so the vendor could have changed the assessment.
include:
  - remote: https://raw.githubusercontent.com/dario-mr/open-trust/78d8ea61528412998fe48dbe3a3e35ffbec496da/ci-templates/gitlab/otrust.gitlab-ci.yml

stages: [build, assess]

variables:
  OTRUST_REF: 78d8ea61528412998fe48dbe3a3e35ffbec496da

build:
  stage: build
  image: docker:28.5.2@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
  services:
    - name: docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  parallel:
    matrix:
      - VARIANT: [clean, vulnerable]
  script:
    # buildx cannot build a builder from TLS env vars; it needs a context (GitLab dind quirk)
    - for i in $(seq 1 20); do docker info >/dev/null 2>&1 && break; sleep 3; done
    - docker context create dind >/dev/null
    - docker buildx create --use --driver docker-container dind >/dev/null
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY" >/dev/null
    # one build, two outputs: the registry image (assessed) and an OCI tar (for offline buyers)
    - >-
      docker buildx build --provenance=mode=min --sbom=false --build-arg VARIANT=$VARIANT
      --output type=oci,dest=image-$VARIANT.oci.tar
      --output type=image,name=$CI_REGISTRY_IMAGE:$VARIANT,push=true
      --metadata-file meta.json .
    # hand the pinned reference to the assess job (dotenv variables outrank job variables)
    - |
      digest=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' meta.json)
      [ -n "$digest" ] || { echo "no digest in meta.json"; cat meta.json; exit 1; }
      echo "OTRUST_IMAGE=$CI_REGISTRY_IMAGE@$digest" > image.env
      cat image.env
  artifacts:
    paths: [image-$VARIANT.oci.tar]
    reports:
      dotenv: image.env
    expire_in: 1 week

assess-clean:
  stage: assess
  extends: .otrust-assess
  needs:
    - job: build
      parallel:
        matrix:
          - VARIANT: clean
  variables:
    OTRUST_SUBJECT: example.com/open-trust-demo:clean
    OTRUST_ATTACH: "true" # buyers verify the registry image by reference alone

assess-vulnerable:
  stage: assess
  extends: .otrust-assess
  needs:
    - job: build
      parallel:
        matrix:
          - VARIANT: vulnerable
  variables:
    OTRUST_SUBJECT: example.com/open-trust-demo:vulnerable
    OTRUST_ATTACH: "true"
    # expected to fail; keep the pipeline green and the certificate as the record
    OTRUST_FAIL_ON_FAILED: "false"
